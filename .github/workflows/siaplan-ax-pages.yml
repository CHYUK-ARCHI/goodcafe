# SIAPLAN AI/AX 온보딩 페이지(siaplan-ax/)를 GitHub Pages 로 배포한다.
# 기존 사이트를 덮어쓰지 않도록 수동 실행(workflow_dispatch)만 허용한다.
# 사용 전: Settings → Pages → Source 를 "GitHub Actions" 로 바꿔야 한다.
name: Deploy SIAPLAN AI/AX page

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: siaplan-ax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: siaplan-ax/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: siaplan-ax/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
